<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVBC Web Render Demo</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        canvas {
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            background-color: #000;
            margin-top: 20px;
            max-width: 100%;
        }
        .controls {
            margin-bottom: 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
        }
        input[type="file"] {
            margin-right: 10px;
        }
        button {
            padding: 8px 16px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        #info {
            margin-top: 10px;
            font-size: 0.9em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>SVBC Renderer (Canvas)</h1>

    <div class="controls">
        <label for="svbcFile">Select a <b>.svbc</b> file:</label>
        <input type="file" id="svbcFile" accept=".svbc">
        <div id="info"></div>
    </div>

    <canvas id="c" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const infoDiv = document.getElementById("info");

        document.getElementById("svbcFile").addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const buf = await file.arrayBuffer();
                renderSvbc(buf);
            } catch (err) {
                console.error("Failed to load SVBC file", err);
                infoDiv.textContent = `Error: ${err.message}`;
            }
        });

        // SVBC v3 wire format (header 20 bytes, packed struct):
        //   [0..3]   magic           "SVBC"
        //   [4]      version         uint8 (currently 3)
        //   [5]      _pad            uint8
        //   [6..7]   codebook_count  uint16 LE
        //   [8..9]   img_width       uint16 LE
        //   [10..11] img_height      uint16 LE
        //   [12..15] node_count      uint32 LE
        //   [16..19] _reserved       uint32 LE
        //   [20 .. 20 + 3*codebook_count)   palette (RGB triples)
        //   [ ... ]  leaf nodes (11 bytes each: x,y,w,h as uint16 LE,
        //             token_id uint16 LE, layer_id uint8)
        const HEADER_SIZE = 20;
        const NODE_SIZE = 11;

        function readPalette(view, codebookCount, offset) {
            const palette = new Array(codebookCount);
            for (let i = 0; i < codebookCount; i++) {
                const off = offset + (i * 3);
                palette[i] = [
                    view.getUint8(off),
                    view.getUint8(off + 1),
                    view.getUint8(off + 2),
                ];
            }
            return palette;
        }

        function renderSvbc(buffer) {
            const view = new DataView(buffer);

            // Header
            const magic = String.fromCharCode(
                view.getUint8(0), view.getUint8(1),
                view.getUint8(2), view.getUint8(3));
            if (magic !== "SVBC") {
                throw new Error("Invalid magic, not an SVBC file.");
            }

            const version = view.getUint8(4);
            if (version !== 3) {
                throw new Error(`Unsupported SVBC version ${version}; this viewer handles v3.`);
            }

            const codebookCount = view.getUint16(6, true);
            const w = view.getUint16(8, true);
            const h = view.getUint16(10, true);
            const nodeCount = view.getUint32(12, true);

            // B9: previous demo skipped the codebook entirely and treated
            // every node as if it carried raw RGB. The writer emits token
            // IDs, so without this palette lookup colours were rendered
            // as black for any non-empty codebook. Reading it now.
            const palette = readPalette(view, codebookCount, HEADER_SIZE);
            const nodesOffset = HEADER_SIZE + codebookCount * 3;

            canvas.width = w;
            canvas.height = h;

            infoDiv.textContent = `Rendering ${nodeCount} nodes...`;
            console.log(`Rendering ${nodeCount} nodes (codebook=${codebookCount})...`);

            const start = performance.now();

            // Clear previous render
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);

            for (let i = 0; i < nodeCount; i++) {
                const off = nodesOffset + i * NODE_SIZE;
                const nx = view.getUint16(off,     true);
                const ny = view.getUint16(off + 2, true);
                const nw = view.getUint16(off + 4, true);
                const nh = view.getUint16(off + 6, true);
                const token = view.getUint16(off + 8, true);
                const pal = palette[token] || [0, 0, 0];
                ctx.fillStyle = `rgb(${pal[0]},${pal[1]},${pal[2]})`;
                ctx.fillRect(nx, ny, nw, nh);
            }

            const end = performance.now();
            const timeMs = (end - start).toFixed(2);
            infoDiv.textContent =
                `Rendered ${nodeCount} nodes in ${timeMs}ms - ` +
                `Dimensions: ${w}x${h} - Format v${version} - Codebook: ${codebookCount}`;
            console.log(`Render time: ${timeMs}ms`);
        }
    </script>
</body>
</html>
