# The checks that are otherwise run by hand: the regression gate (which
# builds on determinism, the recorded baseline, truncation and the C and
# WebAssembly decoders agreeing), the two builds against each other on files with
# slices and holes, and a short run of the fuzzer under the sanitizers.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev clang lld
      - name: Build
        run: make -j"$(nproc)"
      - name: WebAssembly decoder
        run: make wasm
      - name: Regression gate
        run: python3 scripts/verify.py
      - name: Slices and holes, C against WebAssembly
        run: |
          ./nvdr_encode samples/OIP-4140498144.jpg /tmp/prog.nvdr --slices 2 --quiet
          ./nvdr_encode samples/OIP-4140498144.jpg /tmp/dir.nvdr --directional --fast --slices auto --quiet
          node scripts/crosscheck.mjs /tmp/prog.nvdr
          node scripts/crosscheck.mjs /tmp/dir.nvdr
      - name: Sequences and albums, C against WebAssembly
        run: |
          ./nvdrv_encode samples/video/bench/clean /tmp/a.nvdrv --limit 16 --jobs 2
          ./nvdrv_encode samples/video/bench/multi /tmp/b.nvdrv --limit 16 --gop 8 --bframes 0 --block 8
          node scripts/crosscheck_seq.mjs /tmp/a.nvdrv
          node scripts/crosscheck_seq.mjs /tmp/b.nvdrv
          ./nvdr_album pack /tmp/c.nvda samples/OIP-1304511485.jpg samples/OIP-3451121336.jpg samples/OIP-3786546191.jpg
          node scripts/crosscheck_album.mjs /tmp/c.nvda
      - name: Fuzz, briefly
        run: |
          make fuzz
          ./fuzz_nvdr samples/OIP-4140498144.jpg --iters 3000
